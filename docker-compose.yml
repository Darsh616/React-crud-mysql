version: '3.7'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-2
    environment:
      MYSQL_ROOT_PASSWORD: newpassword
      MYSQL_DATABASE: crudnodejsmysql
    ports:
      - "3307:3306"  # Expose MySQL on port 3306
    networks:
      - mynetwork

  app:
    image: darshan616/two-tier-app
    container_name: node-app
    ports:
      - "3000:3000"  # Expose Node.js app on port 3000
    depends_on:
      - mysql
    networks:
      - mynetwork
    environment:
      MYSQL_HOST: mysql  # Use the service name as the host to connect to MySQL
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: newpassword
      MYSQL_DATABASE: crudnodejsmysql

networks:
  mynetwork:
    driver: bridge
